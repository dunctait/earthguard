<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>EarthGuard</title>
    <link rel="stylesheet" href="src/style.css">
</head>
<body>
    <div id="game-container">
        <canvas id="game-canvas"></canvas>
        <div id="ui-overlay">
            <div id="status">
                <span id="level">Level 1</span>
                <span id="hp">HP: 100</span>
                <span id="energy">EN: 100</span>
                <span id="money">$: 0</span>
            </div>
        </div>
        <div id="ui-bottom-overlay">
            <div id="missiles-status">MISSILES TARGETED: 0/2</div>
        </div>
        <div id="controls" class="terminal-panel">
            <div id="upgrade-controls">
                <button id="upgrade-menu-btn" class="terminal-btn upgrade-btn" data-testid="upgrade-menu-btn">UPGRADES</button>
            </div>
            <div id="rotation-controls">
                <div class="rotation-group">
                    <button class="terminal-btn rot-btn big" id="rot-left-big" data-testid="rot-left-10">&lt;&lt;</button>
                    <button class="terminal-btn rot-btn small" id="rot-left-small" data-testid="rot-left-1">&lt;</button>
                </div>
                <div id="angle-display" data-testid="angle-display">0°</div>
                <div class="rotation-group">
                    <button class="terminal-btn rot-btn small" id="rot-right-small" data-testid="rot-right-1">&gt;</button>
                    <button class="terminal-btn rot-btn big" id="rot-right-big" data-testid="rot-right-10">&gt;&gt;</button>
                </div>
            </div>
            <div id="action-controls">
                <div id="fire-container">
                    <div id="power-bar-container">
                        <div id="power-bar" data-testid="power-bar"></div>
                        <div id="power-lock-marker" aria-hidden="true"></div>
                    </div>
                    <button id="fire-btn" class="terminal-btn" data-testid="fire-btn">TARGET</button>
                </div>
                <button id="advance-btn" class="terminal-btn" data-testid="advance-btn">CYCLE</button>
            </div>
        </div>
        <div id="upgrade-modal-overlay" class="modal-overlay is-hidden" aria-hidden="true">
            <div id="upgrade-menu" class="terminal-panel ui-modal upgrade-menu">
                <div class="ui-modal-header">
                    <div id="upgrade-menu-title" class="ui-modal-title">UPGRADES</div>
                    <button id="upgrade-menu-close-btn" class="terminal-btn ui-modal-close" type="button" aria-label="Close upgrades" data-testid="upgrade-menu-close-btn">X</button>
                </div>
                <div id="upgrade-list" class="ui-modal-body upgrade-list"></div>
            </div>
        </div>
        <div id="game-over-overlay" class="modal-overlay is-hidden" aria-hidden="true">
            <div id="game-over-modal" class="terminal-panel ui-modal game-over-modal">
                <div class="ui-modal-header">
                    <div id="game-over-title" class="ui-modal-title">GAME OVER</div>
                </div>
                <div class="ui-modal-body">
                    <div id="game-over-subtitle" class="game-over-subtitle">EARTH BREACHED</div>
                    <button id="play-again-btn" class="terminal-btn upgrade-btn" type="button" data-testid="play-again-btn">PLAY AGAIN</button>
                </div>
            </div>
        </div>
    </div>
    <script src="src/theme.js"></script>
    <script src="src/utils.js"></script>
    <script src="src/ui.js"></script>
    <script src="src/game.js"></script>
    <script src="src/render.js"></script>
    <script>
        // Expose globally for testing
        let game, renderer;
        document.addEventListener('DOMContentLoaded', () => {
            game = new Game();
            renderer = new Renderer(game);
            window.game = game;
            window.renderer = renderer;
        });
    </script>
</body>
</html>
