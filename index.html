<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>EarthGuard</title>
    <link rel="stylesheet" href="src/style.css">
</head>
<body>
    <div id="game-container">
        <canvas id="game-canvas"></canvas>
        <div id="ui-overlay">
            <div id="status">
                <span id="level">Level 1</span>
                <span id="hp">HP: 100</span>
            </div>
        </div>
        <div id="controls">
            <div id="rotation-controls">
                <div class="rotation-group">
                    <button class="rot-btn big" id="rot-left-big" data-testid="rot-left-10">&lt;&lt;</button>
                    <button class="rot-btn small" id="rot-left-small" data-testid="rot-left-1">&lt;</button>
                </div>
                <div id="angle-display" data-testid="angle-display">0°</div>
                <div class="rotation-group">
                    <button class="rot-btn small" id="rot-right-small" data-testid="rot-right-1">&gt;</button>
                    <button class="rot-btn big" id="rot-right-big" data-testid="rot-right-10">&gt;&gt;</button>
                </div>
            </div>
            <div id="action-controls">
                <div id="fire-container">
                    <div id="power-bar-container">
                        <div id="power-bar" data-testid="power-bar"></div>
                    </div>
                    <button id="fire-btn" data-testid="fire-btn">HOLD TO CHARGE</button>
                </div>
                <button id="advance-btn" data-testid="advance-btn">ADVANCE</button>
            </div>
        </div>
    </div>
    <script src="src/game.js"></script>
    <script src="src/render.js"></script>
    <script>
        // Expose globally for testing
        let game, renderer;
        document.addEventListener('DOMContentLoaded', () => {
            game = new Game();
            renderer = new Renderer(game);
            window.game = game;
            window.renderer = renderer;
        });
    </script>
</body>
</html>
